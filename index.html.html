.tk{margin-top:12px}

.pgw{display:none}.pgw.on,.pgw.out{display:block}.pgw.out{position:absolute;left:20px;right:20px}
@keyframes pgInR{from{transform:translateX(100%)}}@keyframes pgInL{from{transform:translateX(-100%)}}
@keyframes pgOutL{to{transform:translateX(-100%)}}@keyframes pgOutR{to{transform:translateX(100%)}}
.pgw.inR{animation:pgInR .32s cubic-bezier(.22,.8,.2,1)}.pgw.inL{animation:pgInL .32s cubic-bezier(.22,.8,.2,1)}
.pgw.outL{animation:pgOutL .32s cubic-bezier(.22,.8,.2,1) forwards}.pgw.outR{animation:pgOutR .32s cubic-bezier(.22,.8,.2,1) forwards}
#app.sl{overflow-x:clip}
.bal{margin-top:3px}.chg{margin-top:7.3px}.sw2 button{height:48px}.cash{margin-top:24.4px}h2{margin-top:25px}

.pdl{background:#121212;border:1px solid #1a1a1a;border-radius:26px;padding:16px 20px 17px;margin-top:11px;cursor:pointer}
.pd3{display:grid;grid-template-columns:60px 1fr 60px;align-items:center}
.pdt{display:block;width:40px;height:40px;margin:0 auto}.pdt svg{width:40px;height:40px;display:block}
.pds{display:flex;justify-content:center;align-items:center;gap:26px;font-size:32px;font-weight:600;line-height:40px}.pds u{text-decoration:none;font-weight:500}
.pdn{margin-top:12px;height:22px}.pdn>b{text-align:center;font-size:17px;font-weight:600;color:#b4b4b6}
.pdc{display:flex;justify-content:center;gap:8px;font-size:15px;font-weight:600;white-space:nowrap}.pdr{color:#ff2a45}
.pdb{display:flex;gap:4px;margin-top:15px}.pdb i{display:block;height:6px;border-radius:3px}
.pdp{display:flex;gap:15px;margin-top:11px}.pdp span{flex:1;height:35px;border-radius:18px;background:#1b1b1c;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#a9a9ab}
.pdu{margin-top:0}.pdc2{width:226px;height:128px;padding:20px;display:block}.pdc2 svg{width:40px;height:40px;display:block}
.pdc2 b{display:block;font-size:17px;font-weight:600;margin-top:8px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pdc2 small{display:block;font-size:15px;color:#9c9c9e;margin-top:3px;line-height:18px}
.pdud{padding:17px 20px 18px;display:block;cursor:default}
.pdh{display:flex;align-items:center;gap:12px}.pdh .ic{width:36px;height:36px;flex:none}.pdh .ic svg.l{width:36px;height:36px}
.pdm{flex:1}.pdm b{display:block;font-size:17px;font-weight:600;line-height:22px;font-variant-numeric:tabular-nums}.pdm small{display:block;font-size:15px;color:#a6a6a8;line-height:18px;margin-top:2px}
#udT{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;align-self:flex-start;line-height:22px;margin-top:2px}
.pdch{display:block;width:calc(100% + 40px);margin:15px -20px 0;height:auto}
.pdbt{display:flex;gap:8px;margin-top:14px}.pdbt>div{flex:1;height:36px;border-radius:18px;background:#1b1b1c;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;white-space:nowrap}.pdbt svg{width:9px;height:9px}.pdbt b{font-weight:600}

<script>

function defaults(){return{lang:(typeof LG==='undefined'?'pl':LG),name:'Konto 1',nick:'LarpSheff',live:1,wl:WL0(),avatar:'',cash:0,override:null,tokens:[
 {n:'Solana',s:'SOL',a:0.00976,v:1.00,p:1.41,ver:0,img:'',sol:1,c:4}]}}
var S=load();
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.tokens){if(!o.nick)o.nick='LarpSheff';if(!o.wl)o.wl=WL0();if(o.live===undefined)o.live=1;return o}}}catch(e){}return defaults()}
function WL0(){return[{s:'SOL',mc:'$60B MC',px:102.58,p:1.41},{s:'BTC',mc:'$1.6T MC',px:81407.10,p:.85},{s:'ETH',mc:'$289B MC',px:2364.70,p:.68}]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function money(n){return '$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function sgn(n){return (n<0?'-':'+')+money(n)}
function clampP(p){return Math.max(p,-99.99)}
function chgOf(v,p){return v-v/(1+clampP(p)/100)}
function amt(a){return a>=1e6?(a/1e6).toFixed(2)+'M':a.toLocaleString('en-US',{maximumFractionDigits:5})}
function stats(){
  var tv=0,tc=0;S.tokens.forEach(function(t){tv+=t.v;tc+=chgOf(t.v,t.p)});
  var total=S.cash+tv,pct,ch;
  if(S.override!==null&&S.override!==''&&!isNaN(S.override)){pct=clampP(+S.override);ch=total-total/(1+pct/100)}
  else{ch=tc;var base=total-tc;pct=base>0?tc/base*100:0}
  return{total:total,ch:ch,pct:pct}}
var LG_={SOL:'<svg class="l" viewBox="0 0 48 48"><defs><linearGradient id="sg" x1="38" y1="12" x2="10" y2="38" gradientUnits="userSpaceOnUse"><stop stop-color="#19fb9b"/><stop offset="1" stop-color="#9945ff"/></linearGradient></defs><circle cx="24" cy="24" r="24" fill="#0b0b0c"/><path fill="url(#sg)" d="M15.500 13.500H35L31.500 18.500H12zM12 21.500H31.500L35 26.500H15.500zM15.500 29.500H35L31.500 34.500H12z"/></svg>',

USDC:'<svg class="l" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#2f78d2"/><circle cx="24" cy="24" r="14" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="26 6"/><text x="24" y="31" text-anchor="middle" font-size="20" font-weight="700" fill="#fff" font-family="-apple-system,Arial">$</text></svg>',

function icon(t,badge){
  var k=String(t.s||'').toUpperCase(),L=!t.img&&LG_[k],st=t.img?'background-image:url('+t.img+')':'--c:'+COLORS[(t.c||0)%COLORS.length];
  if(L)return '<div class="ic lg">'+L+(badge&&k!=='SOL'&&k!=='ETH'&&k!=='BTC'?'<i>'+(k==='USDC'?BG.eth:BG.sol)+'</i>':'')+'</div>';
  return '<div class="ic" style="'+st+'">'+(t.img?'':esc((t.n||'?').charAt(0).toUpperCase()))+(badge&&!t.sol?'<i>'+BG.sol+'</i>':'')+'</div>'}

  $('chg').className='chg hm '+(up?'up':'dn');
  $('chg').innerHTML=(Math.abs(st.ch)<1?(st.ch<0?'-':'+')+'$'+Math.abs(st.ch).toFixed(4):sgn(st.ch))+' <span class="pill">'+(up?'+':'-')+Math.abs(st.pct).toFixed(2)+'%</span>';

  $('sin').innerHTML=h}
