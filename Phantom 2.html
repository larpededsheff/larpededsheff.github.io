<style>
:root{--purple:#ab9ff2;--card:#181818;--green:#3ddc5b;--red:#ff5c5c;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff}
#splash{position:fixed;inset:0;background:var(--purple);display:flex;align-items:center;justify-content:center;z-index:20;transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
#splash svg{width:min(32vw,240px);min-width:120px;height:auto;animation:pop .8s both}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.body{fill:#fff}.eye{fill:var(--purple)}
#app{max-width:430px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 120px;opacity:0;transition:opacity .6s}
#app.show{opacity:1}
.tabs{display:flex;gap:10px;overflow:hidden;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:#f3ecd2 center/cover;flex:none;position:relative;overflow:hidden;cursor:pointer;border:0;padding:0}
.av.def::before{content:"";position:absolute;left:8px;right:6px;bottom:-4px;height:26px;border-radius:50% 50% 0 0;background:#f2703b}
.av.def::after{content:"";position:absolute;left:9px;top:9px;width:26px;height:10px;border-radius:12px 12px 2px 2px;background:#1a1a1a}
.tab{padding:11px 20px;border-radius:30px;background:#1a1a1a;color:#aaa;font-size:15px;white-space:nowrap}
.tab.on{background:var(--purple);color:#111}
.acc{margin-top:22px;color:#bbb;font-size:17px;font-weight:600}
.bal{font-size:56px;font-weight:700;letter-spacing:-1px;margin-top:2px}
.chg{display:flex;gap:8px;align-items:center;font-weight:600;font-size:16px;margin-top:2px}
.up{color:var(--green)}.dn{color:var(--red)}
.pill{padding:2px 8px;border-radius:7px;color:#0b1a0e}
.up .pill{background:var(--green)}.dn .pill{background:var(--red);color:#2a0808}
.card{background:var(--card);border-radius:22px;padding:18px 20px;display:flex;align-items:center;gap:14px;margin-top:12px}
.cash{margin-top:28px;justify-content:space-between;font-size:17px;font-weight:600}
.cash .l{display:flex;align-items:center;gap:20px}
.bill{width:34px;height:22px;border-radius:5px;background:#666;position:relative}
.bill::after{content:"";position:absolute;left:12px;top:6px;width:10px;height:10px;border-radius:50%;background:#222}
h2{font-size:22px;margin:30px 0 6px;font-weight:700}
.ic{width:52px;height:52px;border-radius:50%;flex:none;position:relative;background:var(--c) center/cover;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.ic i{position:absolute;right:-6px;bottom:-4px;width:22px;height:22px;border-radius:7px;background:#eee;border:2px solid var(--card)}
.ic i::after{content:"";position:absolute;left:5px;top:6px;width:10px;height:3px;background:#222;border-radius:2px;box-shadow:0 4px #222}
.sol{background:#111}
.sol span{position:absolute;left:14px;width:24px;height:5px;border-radius:2px;background:linear-gradient(90deg,#9945ff,#19fb9b);transform:skewX(-20deg)}
.mid{flex:1;min-width:0}
.nm{font-weight:600;font-size:17px;display:flex;align-items:center;gap:6px}
.sub{color:#aaa;font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{text-align:right}.r b{font-size:17px;font-weight:600}.r div{font-size:15px;font-weight:600;margin-top:2px}
.ver{width:16px;height:16px;border-radius:50%;background:var(--purple);display:inline-block;position:relative;flex:none}
.ver::after{content:"";position:absolute;left:5px;top:3px;width:3px;height:6px;border:solid #111;border-width:0 2px 2px 0;transform:rotate(40deg)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(transparent,#000 40%);display:flex;gap:12px;max-width:430px;margin:0 auto}
.search{flex:1;background:#1c1c1c;border-radius:30px;padding:16px 20px;color:#777;font-size:17px;transition:opacity .25s,filter .25s}
.plus{width:56px;height:56px;border-radius:50%;background:var(--purple);color:#111;font-size:34px;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .25s;cursor:pointer}
body.open .plus{transform:rotate(45deg)}
body.open .search{opacity:.35;filter:blur(6px)}
#ov{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .25s}
body.open #ov{opacity:1;pointer-events:auto}
#menu{position:fixed;right:max(16px,calc(50% - 199px));bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:7;display:flex;flex-direction:column;gap:18px;align-items:flex-end;pointer-events:none}
.mi{display:flex;align-items:center;gap:16px;font-size:22px;font-weight:600;opacity:0;transform:translateY(16px) scale(.9);transition:opacity .22s,transform .22s}
.mi i{width:56px;height:56px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center}
.mi svg{width:26px;height:26px;stroke:#111;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.open #menu{pointer-events:auto}
body.open .mi{opacity:1;transform:none}
body.open .mi:nth-child(3){transition-delay:.06s}body.open .mi:nth-child(2){transition-delay:.1s}body.open .mi:nth-child(1){transition-delay:.14s}

#sheet{position:fixed;inset:0;z-index:9;background:#0c0c0c;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheet.open{transform:none}
.sin{max-width:430px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.sh{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:700;margin-bottom:6px}
.x{width:40px;height:40px;border-radius:50%;background:#222;color:#fff;border:0;font-size:20px}
.sec{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#888;margin:24px 4px 8px}
.box{background:var(--card);border-radius:20px;padding:14px}
label.f{display:block;font-size:12px;color:#999;margin:0 0 4px 2px}
input[type=text],input[type=number]{width:100%;background:#262626;border:1px solid transparent;border-radius:12px;color:#fff;font-size:16px;padding:11px 12px;outline:0}
input:focus{border-color:var(--purple)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.row{display:flex;gap:10px;align-items:flex-end}.row>div{flex:1}
.btn{background:var(--purple);color:#111;border:0;border-radius:12px;font-size:15px;font-weight:700;padding:12px 16px;cursor:pointer;white-space:nowrap}
.btn.g{background:#2a2a2a;color:#fff}
.btn.full{width:100%;margin-top:12px}
.tot{font-size:15px;color:#aaa;margin-top:12px}.tot b{color:#fff}
.tkh{display:flex;gap:12px;align-items:center;margin-bottom:2px}
.up-ic{cursor:pointer;flex:none}
.up-ic input{display:none}
.cam{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--purple);color:#111;font-size:12px;display:flex;align-items:center;justify-content:center}
.del{background:#2a1515;color:#ff7b7b;border:0;border-radius:12px;width:44px;height:44px;font-size:18px;flex:none}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px;color:#ccc}
.chk input{width:18px;height:18px;accent-color:var(--purple)}
.tk{margin-top:12px}
.hint{font-size:13px;color:#888;margin-top:8px;line-height:1.4}
*{-webkit-tap-highlight-color:transparent}
#splash{transition:opacity .7s ease .2s}
#splash svg{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both,breathe 2.6s ease-in-out .9s infinite}
@keyframes breathe{50%{transform:translateY(-6px) scale(1.03)}}
#splash.hide svg{animation:none;transform:scale(14);transition:transform 1s cubic-bezier(.7,0,.3,1)}
#app{transition:opacity .7s ease,transform .5s cubic-bezier(.2,.85,.25,1),filter .5s}
body.tkopen #app{transform:scale(.93);filter:brightness(.45)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
#app.intro>*:not(#list){animation:rise .75s cubic-bezier(.2,.8,.2,1) both}
#app.intro .tabs{animation-delay:.05s}#app.intro .acc{animation-delay:.1s}#app.intro .bal{animation-delay:.15s}#app.intro .chg{animation-delay:.2s}#app.intro .cash{animation-delay:.27s}#app.intro h2{animation-delay:.33s}
#app.intro #list .card{animation:rise .75s cubic-bezier(.2,.8,.2,1) both}
#app.intro #list .card:nth-child(1){animation-delay:.4s}#app.intro #list .card:nth-child(2){animation-delay:.47s}#app.intro #list .card:nth-child(3){animation-delay:.54s}#app.intro #list .card:nth-child(4){animation-delay:.61s}#app.intro #list .card:nth-child(5){animation-delay:.68s}#app.intro #list .card:nth-child(n+6){animation-delay:.75s}
.card[data-i]{cursor:pointer;transition:transform .18s cubic-bezier(.3,.9,.3,1),background .2s}
.card[data-i]:active{transform:scale(.97);background:#222}
.tab,.av,.btn,.act,.pbtn,.shr,.x,.del{transition:transform .15s cubic-bezier(.3,.9,.3,1),opacity .2s}
.tab:active,.av:active,.btn:active,.act:active,.pbtn:active,.shr:active,.x:active,.del:active{transform:scale(.93)}
.plus:active{transform:scale(.9)}body.open .plus:active{transform:rotate(45deg) scale(.9)}
.mi{transition:opacity .25s,transform .5s cubic-bezier(.34,1.56,.64,1)}
.mi:active i{transform:scale(.9)}

#tk{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);bottom:0;z-index:8;max-width:430px;margin:0 auto;background:#0b0b0d;border-radius:28px 28px 0 0;box-shadow:0 -10px 50px rgba(0,0,0,.8);transform:translateY(105%);visibility:hidden;transition:transform .5s cubic-bezier(.2,.85,.25,1),visibility 0s .5s;overflow:hidden}
#tk.open{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,.85,.25,1),visibility 0s}
#tkScroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:96px 16px 140px}
.tkhd{position:absolute;left:0;right:0;top:0;z-index:3;background:linear-gradient(#0b0b0d 72%,transparent);padding-bottom:16px}
.grabz{height:34px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.grab{width:38px;height:5px;border-radius:5px;background:#3a3a3e}
.hrow{display:flex;align-items:center;gap:10px;padding:0 16px;height:44px;position:relative}
.hrow .ic{width:38px;height:38px;font-size:15px;z-index:1}
.hmid{position:absolute;left:0;right:0;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .3s}
